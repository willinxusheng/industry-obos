# -*- coding: utf-8 -*-
# 看门狗：独立于每日更新流水线，专门捕获"该更新却没更新"的漏网情况。
#
# 为什么必须存在：daily.yml 的失败告警依赖 failure()，但"定时被跳过/被门卫 skip"
# 是 success 结局，failure() 永不触发 —— 那种"静默漏更"只有看门狗能发现。
#
# 为什么改成每 30 分钟跑一次：GitHub 的 schedule 会延迟 9~10 小时且漂移，
# 原来只在北京 23:45 跑一次，被延迟后落到次日上午，判定时机完全错位。
# 加密度后，必定有运行落进"北京凌晨判定窗口"。
#
# 为什么只在北京 00:00-09:30 判定：此时"上一个交易日"的更新窗口(16:00-24:00)
# 已完整过去。若在傍晚判定，会因 GitHub 定时漂移（更新可能 18:40 才发生）
# 而把"还没轮到更新"误报成"漏更"。凌晨判定 = 不会误报。
#
# 告警分级（关键，避免节假日刷屏）：
#   数据落后 且 bot 已 >=1 天没提交 -> 真漏更，开 ci-alert issue
#   数据落后 但 bot 近期有提交     -> 流水线在跑，只是没有更新的交易日数据
#                                    （节假日/数据源未发布当日K线），只记 notice 不告警
name: OBOS Daily Watchdog

on:
  schedule:
    # 每 30 分钟一次（不用 1-5 限制星期：GitHub cron 的星期按 UTC，
    # 与北京时间会错位，改为在脚本里用北京时间判断周末）
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch: {}        # 允许手动触发实测

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Liveness check (previous trading day updated?)
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            // 北京时间 = UTC+8（纯算术，不依赖 Intl 时区数据，杜绝 tzdata 缺失风险）
            const now = new Date();
            const bj = new Date(now.getTime() + 8 * 3600 * 1000);
            const today = bj.toISOString().slice(0, 10);
            const tmin = bj.getUTCHours() * 60 + bj.getUTCMinutes();
            const dow = bj.getUTCDay();   // 0=Sun .. 6=Sat
            const hm = String(bj.getUTCHours()).padStart(2, '0') + ':' + String(bj.getUTCMinutes()).padStart(2, '0');
            console.log(`watchdog 北京 ${today} ${hm} (dow=${dow}, tmin=${tmin})`);

            if (dow === 0 || dow === 6) { console.log('周末休市，跳过'); return; }
            if (tmin >= 570) {
              console.log('仅在北京 00:00-09:30 判定（避开盘中与傍晚更新窗口，防止定时漂移误报），本次跳过');
              return;
            }

            // 期望的最新完整交易日 = 上一个工作日（周一凌晨则回溯到上周五）
            const exp = new Date(bj.getTime());
            exp.setUTCDate(exp.getUTCDate() - (dow === 1 ? 3 : 1));
            const expected = exp.toISOString().slice(0, 10);
            console.log(`expected(上一个工作日)=${expected}`);

            // (a) 源 data.js 的 asof
            let srcAsOf = '';
            try {
              const resp = await github.rest.repos.getContent({ owner, repo, path: 'data.js', ref: 'main' });
              const txt = Buffer.from(resp.data.content, 'base64').toString('utf8');
              const m = txt.match(/"asof"\s*:\s*"([0-9-]+)"/);
              srcAsOf = m ? m[1] : '';
            } catch (e) { console.log('getContent(src) err: ' + e.message); }

            // (b) 线上 Pages 站点 asof（用户浏览器实际加载的），带重试
            let liveAsOf = '';
            try {
              const liveUrl = `https://${owner}.github.io/${repo}/data.js`;
              // 5 次重试 + 递增退避：网络偶发抖动不应被误判为"Pages 站点不可达"而误告警
              for (let attempt = 1; attempt <= 5; attempt++) {
                try {
                  // 必须带超时：Node 的 fetch 默认无超时，站点卡住会一直挂着吃满
                  // 整个 job 的 timeout-minutes 预算，导致这次检查静默不执行。
                  const r = await fetch(liveUrl, { redirect: 'follow', signal: AbortSignal.timeout(20000) });
                  if (r.ok) {
                    const txt = await r.text();
                    const m = txt.match(/"asof"\s*:\s*"([0-9-]+)"/);
                    liveAsOf = m ? m[1] : '';
                    break;
                  }
                  console.log(`live fetch attempt ${attempt} status ${r.status}`);
                } catch (e2) { console.log(`live fetch attempt ${attempt} err: ${e2.message}`); }
                if (attempt < 5) await new Promise(r => setTimeout(r, attempt * 3000));
              }
            } catch (e) { console.log('live fetch err: ' + e.message); }

            // (c) bot 最近一次提交的「北京日期」—— 用于区分"真漏更"与"节假日无新数据"
            //     判据用"该日期是否 >= 应到交易日"，而不是"距今几天"：
            //     后者在长假+周末时会误报（周末所有运行都跳过、本就不会有提交）。
            let lastBotCommitDate = '', lastBotDays = 999;
            try {
              const commits = await github.rest.repos.listCommits({ owner, repo, author: 'github-actions[bot]', per_page: 5 });
              if (commits.data.length) {
                const raw = new Date(commits.data[0].commit.committer.date);
                lastBotCommitDate = new Date(raw.getTime() + 8 * 3600 * 1000).toISOString().slice(0, 10);
                lastBotDays = (now - raw) / 86400000;
              }
            } catch (e) { console.log('listCommits err: ' + e.message); }

            console.log(`srcAsOf=${srcAsOf || '缺失'} liveAsOf=${liveAsOf || '缺失'} expected=${expected} lastBotCommit=${lastBotCommitDate || '查不到'} (${lastBotDays === 999 ? '?' : lastBotDays.toFixed(2)} 天前)`);

            // ── 判定 ───────────────────────────────────────────────────────────
            const problems = [];
            let alert = false;

            // 流水线是否在「应到交易日」当天或之后仍有提交 -> 说明它活着，只是没新数据
            const ranOnOrAfterExpected = !!lastBotCommitDate && lastBotCommitDate >= expected;
            if (!srcAsOf) {
              problems.push(`源 data.js 的 asof 缺失，无法读取`); alert = true;
            } else if (srcAsOf < expected) {
              if (!ranOnOrAfterExpected) {
                problems.push(`数据落后：asof=${srcAsOf} < 应到交易日 ${expected}，且流水线在 ${expected} 当天及之后没有任何提交（最近一次 bot 提交于 ${lastBotCommitDate || '查不到'}）→ 判定为真漏更`);
                alert = true;
              } else {
                problems.push(`数据落后：asof=${srcAsOf} < 应到交易日 ${expected}，但流水线在 ${lastBotCommitDate} 仍有提交 → 判定为节假日或数据源未发布该日K线，不告警`);
              }
            }

            if (liveAsOf && srcAsOf && liveAsOf < srcAsOf) {
              problems.push(`源已更新(asof=${srcAsOf})但线上 Pages 站点 asof=${liveAsOf} 未同步，疑似 GitHub Pages 部署失败`);
              alert = true;
            }
            if (srcAsOf && !liveAsOf) {
              problems.push(`线上 Pages 站点 data.js 不可达或读不到 asof（连续 3 次重试失败）`);
              alert = true;
            }

            if (!alert) {
              console.log('✅ 健康：数据已达应到交易日' + (problems.length ? '（有非致命提示：' + problems.join('；') + '）' : '，源与线上 Pages 均正常'));
              return;
            }

            // ── 告警 ───────────────────────────────────────────────────────────
            const TITLE = '⚠️ A股OBOS看板 watchdog：交易日数据未按时更新';
            const ts = new Date().toISOString();
            const body = `看门狗检测（北京时间 ${today} ${hm}）：\n` +
              `- 应到交易日(上一个工作日): ${expected}\n` +
              `- 源 data.js asof: ${srcAsOf || '缺失'}\n` +
              `- 线上 Pages asof: ${liveAsOf || '缺失/不可达'}\n` +
              `- bot 最近提交距今: ${lastBotDays === 999 ? '查不到' : lastBotDays.toFixed(2) + ' 天'}\n` +
              `- 问题: ${problems.join('；')}\n\n` +
              `排查方向：GitHub 定时调度是否被整体推迟（Actions 页面看运行分布）、取数源(腾讯/东财/新浪)是否可达、main 写入权限、GitHub Pages 部署是否失败。`;
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: ['ci-alert'] });
            const found = existing.data.find(i => i.title === TITLE);
            if (found) {
              await github.rest.issues.createComment({ owner, repo, issue_number: found.number, body: `再次触发 @ ${ts}\n${body}` });
              console.log('已更新既有 ci-alert issue #' + found.number);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title: TITLE, body, labels: ['ci-alert'] });
              console.log('已开 ci-alert issue #' + created.data.number);
            }
