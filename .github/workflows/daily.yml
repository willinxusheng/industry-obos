# -*- coding: utf-8 -*-
# A股全行业OBOS看板 云端每日自动更新工作流（Deploy from a branch 模式，与斐波那契同源）
#
# 部署架构：
#   workflow 把构建好的 index.html 提交回 main 分支，GitHub Pages 以
#   "Deploy from a branch (main, /root)" 自动监听 main 并重新部署。
#   此模式无需 pages/id-token 写权限，新仓库无 deploy-pages 首次权限环境坑。
#
# 取数架构（多源顺序回退，对标斐波那契加固）：
#     ① 腾讯 proxy.finance.qq.com (中国本地主源)
#     ② 东方财富 push2his          (海外常被证实可达)
#     ③ 新浪 money.finance.sina.com (海外常被证实可达)
#   任一源成功即用；>2 行业取数全失败则整体中止，绝不用残缺数据覆盖线上。
#
# 加固（对标斐波那契四重防漏更）：
#   ① 高频 cron 兜底：每 30 分钟一次（详见 on.schedule 注释）。因 GitHub schedule 实测
#      延迟 9~10h 且会漂移，稀疏槽位会被推迟到凌晨并撞上盘前保护被 100% 秒杀，必须靠密度取胜。
#   ② 取数重试：每个脚本内置重试 + 三源回退。
#   ③ 失败可见告警：流水线失败时开/更新仓库 issue（label=ci-alert）。
#   ④ 新鲜度门卫(基于数据交易日 asof + 盘后保护) + keep-alive：数据已含今日收盘/周末/盘前跳过；每日提交戳防 GitHub 停用定时。

name: Daily A股全行业OBOS看板更新

on:
  # push main 即触发部署（源码更新后自动同步到 Pages）
  push:
    branches: [main]
  # ⚠️ 关键教训（2026-08 本仓库实测，勿改回稀疏槽位）：
  #   GitHub 的 `on: schedule` 会延迟 9~10 小时才真正执行，且延迟量还会漂移。
  #   原先只用"北京 16:30/18:30/21:00/22:30"四个稀疏槽位，结果全部被推迟到北京时间
  #   凌晨 02:00~08:00 才跑，正好撞上下方的"盘前保护(<16:00 跳过)"被 100% 秒杀——
  #   查运行日志可见：Freshness gate 之后的所有步骤连续多天全部 skipped（空转），
  #   而 run 结论仍是 success，告警永不触发。这就是"云端不每日更新"的真根因。
  # 对策：把定时密度提高到每 30 分钟一次。如此无论延迟多少、如何漂移，北京时间
  #   16:00 之后必定有运行落进去并取到当日收盘；其余未命中的运行会在 Freshness gate
  #   处几秒内跳过（成本可忽略，公开仓库 Actions 分钟免费）。
  schedule:
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch: {}   # 允许 Actions 页面手动触发，便于首跑实测与排错

# Deploy-from-branch 模式只需 contents:write（提交 index.html / keep-alive）和 issues:write（告警）
permissions:
  contents: write
  issues: write

concurrency:
  group: obos-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # [2026-09-03] 二级管线加入后总时长上调: 109 行业回测实测 ~10 分钟级，留足余量
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 新鲜度门卫（始终运行）──────────────────────────────────────────────
      # 设计：基于「数据最新交易日 asof」判断，而非"今天是否跑过"戳。
      #   - 周末跳过；盘前(北京<16:00)跳过，避免把不完整盘中K线当收盘数据发布；
      #   - 若 checkout 的上一版数据 asof 已等于今日 -> 已含收盘 -> 跳过；
      #   - 否则拉取+计算+部署。彻底消除"早次 run 误标今天→主更新被跳过"的竞态。
      - name: Freshness gate (skip if data current / weekend / intraday)
        id: fresh
        run: |
          # 北京时间 = UTC+8（中国无夏令时），刻意不用 TZ=Asia/Shanghai：
          # 一旦 runner 缺 tzdata，TZ 会被静默忽略、tmin 变成 UTC 口径，
          # 盘中封锁窗口将整体错位（16:00 的闸门会跑到北京午夜），更新彻底停摆。
          # 改为纯算术换算，零外部依赖，杜绝这个单点故障。
          UTC_H=$(date -u +%H); UTC_M=$(date -u +%M)
          tmin=$(( (10#$UTC_H * 60 + 10#$UTC_M + 480) % 1440 ))
          HM=$(printf "%02d:%02d" $((tmin / 60)) $((tmin % 60)))
          TODAY=$(date -u -d "+8 hours" +%Y-%m-%d)
          DOW=$(date -u -d "+8 hours" +%u)   # 1=Mon .. 7=Sun
          echo "北京 $TODAY $HM (dow=$DOW tmin=$tmin)"
          # ⚠️ 必须读 data.js(已发布产物)而非 data/industry_obos.json：
          #   提交步骤只 add index.html/echarts.min.js/data.js，data/ 目录从不入库，
          #   仓库里那份 json 是永久陈旧的快照。若拿它判断，"已最新就跳过"永远不命中
          #   —— 定时加密到每30分钟后会导致每天 48 次全量跑(约3小时 runner 白烧)。
          # 记录「本次运行前的线上数据交易日」，供下游判断"是否真的取到了新数据"
          # （节假日/数据源尚未发布当日K线时，新 asof 会等于旧 asof，此时不应判失败）
          ASOF=$(python3 -c "import re,io; t=io.open('data.js',encoding='utf-8').read(); m=re.search(r'\"asof\"\s*:\s*\"([0-9-]+)\"', t); print(m.group(1) if m else '')" 2>/dev/null || true)
          echo "asof_before=$ASOF"
          echo "asof_before=$ASOF" >> "$GITHUB_OUTPUT"
          if [ "$DOW" = "6" ] || [ "$DOW" = "7" ]; then
            echo "周末休市 -> skip"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 盘中及收盘结算期(09:30-16:00)一律跳过：绝不发布不完整盘中K线当收盘数据。
          # 16:00 而非 15:00，是给数据源留 1 小时落定当日日线。
          if [ "$tmin" -ge 570 ] && [ "$tmin" -lt 960 ]; then
            echo "盘中/结算期($HM)，不发布不完整数据 -> skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 期望的最新「完整交易日」：
          #   16:00 之后  -> 今天（当日收盘应已可取）
          #   凌晨 00:00-09:30 -> 上一个工作日（此时今日尚未开盘，最新完整数据是昨天）
          # 凌晨窗口的意义：若前一交易日傍晚的更新窗口因 GitHub 定时漂移而没命中，
          #   凌晨这次会把上一个交易日的数据补上 —— 保证数据永不超过 1 天滞后。
          if [ "$tmin" -ge 960 ]; then
            EXPECTED="$TODAY"
          elif [ "$DOW" = "1" ]; then
            EXPECTED=$(date -u -d "+8 hours -3 days" +%Y-%m-%d)   # 周一凌晨 -> 上周五
          else
            EXPECTED=$(date -u -d "+8 hours -1 day" +%Y-%m-%d)
          fi
          echo "expected=$EXPECTED asof=$ASOF"
          # 注意：bash 的 [[ ]] 不支持 ">= " 字符串比较（只支持 < 和 >），
          # 故拆成 "等于 或 大于" 两个判断，等价表达 ASOF >= EXPECTED。
          if [ -n "$ASOF" ] && { [ "$ASOF" = "$EXPECTED" ] || [[ "$ASOF" > "$EXPECTED" ]]; }; then
            echo "数据已含最新完整交易日($ASOF >= $EXPECTED) -> skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.fresh.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python deps
        if: steps.fresh.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Set up Node
        if: steps.fresh.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # 取数（内置重试 + 三源回退）；连续失败脚本自身 exit≠0 中止，避免脏数据
      - name: Fetch benchmark (沪深300, multi-source)
        if: steps.fresh.outputs.skip != 'true'
        run: python fetch_benchmark.py

      - name: Fetch 31 industries (multi-source)
        if: steps.fresh.outputs.skip != 'true'
        run: python fetch_data.py

      # [2026-09-03] 申万二级 109 个细分行业取数（同多源回退契约；>5 个失败整体中止）
      - name: Fetch 109 sub-industries (multi-source)
        if: steps.fresh.outputs.skip != 'true'
        run: python fetch_sub_data.py

      # 计算 + 质量门禁（compute.py 内置 quality_gate，status=FAIL 时自行 SystemExit 阻断部署）
      - name: Compute OBOS + backtest (quality gate)
        if: steps.fresh.outputs.skip != 'true'
        run: python compute.py

      # [2026-09-03] 二级细分行业同管线计算（PIT/回测/校准全套，含口径真空期判据）
      - name: Compute sub-industry OBOS + backtest (quality gate)
        if: steps.fresh.outputs.skip != 'true'
        run: python compute.py --sub

      # 前端门禁：在 DOM stub 下实跑 app.js，捕获运行时错误/NaN/字段缺失/区间顺序错
      - name: Frontend smoke test (test_render.js)
        if: steps.fresh.outputs.skip != 'true'
        run: node test_render.js

      # [2026-09-03] 细分看板前端门禁（sub_app.js + sub_obos.json）
      - name: Frontend smoke test sub (test_render.js --sub)
        if: steps.fresh.outputs.skip != 'true'
        run: node test_render.js --sub

      # [2026-09-03] 门禁的门禁（反假绿）：造极端市况 + 故意改坏 app，验证上面那条门禁
      # 既不会在极端市况下误报 FAIL 拖垮刷新，也不是恒真的假绿。零第三方依赖，可安全进 CI。
      - name: Gate self-check (extreme market + broken-app negative control)
        if: steps.fresh.outputs.skip != 'true'
        run: node gate_edge_test.js

      # 组装 HTML（echarts/data 外链独立文件以利用浏览器缓存，app.js 内联）
      - name: Build dashboard HTML
        if: steps.fresh.outputs.skip != 'true'
        run: python build_html.py

      # [2026-09-03] 组装细分看板 sub.html + sub_data.js
      - name: Build sub dashboard HTML
        if: steps.fresh.outputs.skip != 'true'
        run: python build_html.py --sub

      # 生成 Pages 入口 index.html（根目录）
      - name: Prepare Pages entry (index.html)
        if: steps.fresh.outputs.skip != 'true'
        run: cp industry-obos-dashboard.html index.html

      # 部署前最后一道门禁：断言本次数据 asof 在新鲜度窗口内（今天及往前4天，覆盖周末+偶发延迟）
      # 纵深防御：即使 freshness gate 任何逻辑失效，也绝不用陈旧数据覆盖线上
      - name: Assert data freshness before deploy
        id: assert
        if: steps.fresh.outputs.skip != 'true'
        env:
          ASOF_BEFORE: ${{ steps.fresh.outputs.asof_before }}
        run: |
          NEW=$(python3 -c "import json;print((json.load(open('data/industry_obos.json')).get('asof','') or ''))")
          CUT=$(python3 -c "import datetime;print((datetime.date.today()-datetime.timedelta(days=4)).strftime('%Y-%m-%d'))")
          echo "asof_new=$NEW asof_before=$ASOF_BEFORE cutoff>=$CUT"
          # 把本次构建产出的 asof 传给下游验收步骤。
          # ⚠️ 验收绝不能再写死"今天"：凌晨补更窗口产出的是「上一交易日」数据，
          #    若期望值写死今天，补更必然验收失败并误报告警。
          echo "asof_new=$NEW" >> "$GITHUB_OUTPUT"
          # 关键：若新 asof 与运行前完全相同，说明"没有更新的交易日数据"（节假日/数据源
          # 尚未发布当日K线）。这不是故障——放行让提交步骤自然 no-op、验收步骤跳过，
          # 30 分钟后自动重试即可。若在此处判失败，长假(春节/国庆)期间会每天刷 48 条误报告警。
          if [ -n "$NEW" ] && [ "$NEW" = "$ASOF_BEFORE" ]; then
            echo "::notice::本次未取到更新的交易日数据（节假日/数据源尚未发布当日K线）。不判失败、不覆盖线上，等待下次运行自动重试。"
            exit 0
          fi
          if [[ -z "$NEW" || "$NEW" < "$CUT" ]]; then
            echo "::error::数据 asof=${NEW:-缺失} 不在新鲜度窗口(>= $CUT)，拒绝用陈旧数据覆盖线上"
            exit 1
          fi
          echo "✅ 数据新鲜度断言通过 asof=$NEW"

      # 提交 index.html 回 main；Pages 以 Deploy from a branch 自动重新部署
      # [skip ci] 避免 workflow 递归触发，但不影响 Pages 监听 main 分支的 push 事件
      - name: Commit & push index.html to main
        id: commit
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html echarts.min.js data.js sub.html sub_data.js
          if git diff --cached --quiet; then
            echo "::notice::产物无变化（数据源尚未发布更新的交易日K线，或当日为节假日），不提交、不覆盖线上，等待下次运行重试"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: daily refresh [skip ci]"
            # 不静默吞：rebase 失败先中止、退避后重试一次；仍失败则明确报错退出触发告警。
            # 说明：并发运行或 keep-alive 同时改 last_build.txt 是常见冲突源，重试通常可解。
            # 早期这里写 `|| true` 会把冲突吞掉、让后续 push 报出误导性的错误，排查极易跑偏。
            if ! git pull --rebase --autostash origin main; then
              echo "::warning::首次 pull --rebase 失败，中止后重试一次"
              git rebase --abort 2>/dev/null || true
              sleep 5
              if ! git pull --rebase --autostash origin main; then
                echo "::error::git pull --rebase 连续失败（远端可能有并发提交）。本次放弃推送，30 分钟后自动重试；若持续失败请人工介入。"
                exit 1
              fi
            fi
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "✅ index.html pushed, Pages will auto-deploy from main"
          fi

      # 部署后验收：分两阶段轮询，确认"源 data.js 已落地"且"线上 Pages 站点已重新部署"。
      # 之前只查 raw.githubusercontent(源文件)漏掉了"源已更新但 Pages 部署静默失败"这一盲区——
      # 那样用户浏览器看到的仍是旧数据，而所有门禁都绿。现补验用户实际加载的线上站点。
      - name: Verify deployed data freshness (post-push gate)
        # 仅当本次确实提交并推送了新产物才验收。若"无新数据"(节假日/数据源未发布当日K线)
        # 而本次未提交，则跳过验收——否则会误判为部署失败并刷屏告警（定时已加密到每30分钟）。
        if: steps.fresh.outputs.skip != 'true' && steps.commit.outputs.pushed == 'true'
        run: |
          # 期望值 = 本次实际构建出的 asof（由断言步骤产出），绝不能写死"今天"。
          # 原因：凌晨补更窗口产出的是「上一交易日」数据，若期望值写死今天，
          #      则每一次补更都会因等不到"今天"而验收失败并误报告警。
          EXPECTED="${{ steps.assert.outputs.asof_new }}"
          if [ -z "$EXPECTED" ]; then
            echo "::error::未拿到本次构建的 asof（断言步骤未产出 asof_new），无法验收"
            exit 1
          fi
          echo "本次构建 asof=$EXPECTED（凌晨补更时该值为上一交易日，属正常）"
          OWNER=${GITHUB_REPOSITORY%/*}; REPO=${GITHUB_REPOSITORY#*/}
          SRC="https://raw.githubusercontent.com/$OWNER/$REPO/main/data.js"
          LIVE="https://$OWNER.github.io/$REPO/data.js"
          asof_of () { curl -fsS --max-time 20 "$1" 2>/dev/null | python3 -c "import sys,re; t=sys.stdin.read(); m=re.search(r'\"asof\"\s*:\s*\"([0-9-]+)\"', t); print(m.group(1) if m else '')" 2>/dev/null || true; }
          # 阶段A：源文件是否已落地（排查提交/推送未生效）
          A=""
          for i in $(seq 1 12); do
            A=$(asof_of "$SRC"); [ "$A" = "$EXPECTED" ] && break
            echo "poll src $i/12: asof=$A"; sleep 10
          done
          if [ "$A" != "$EXPECTED" ]; then
            echo "::error::推送后源 data.js 未更新为 $EXPECTED（当前 $A），提交/推送可能未生效"
            exit 1
          fi
          echo "✅ 源 data.js 已更新为 $EXPECTED"
          # 阶段B：线上 Pages 站点是否已重新部署（直接对应用户体验，补 Pages 静默失败盲区）
          A=""
          for i in $(seq 1 40); do
            A=$(asof_of "$LIVE"); [ "$A" = "$EXPECTED" ] && break
            echo "poll live $i/40: asof=$A"; sleep 15
          done
          if [ "$A" != "$EXPECTED" ]; then
            echo "::error::源已更新但线上 Pages 站点($LIVE)未同步为 $EXPECTED（当前 $A），GitHub Pages 部署可能失败"
            exit 1
          fi
          echo "✅ 线上 Pages data.js asof=$A 已是最新($EXPECTED)"

      # keep-alive：记录今日已更新戳并 [skip ci] 提交，防 GitHub 因长期无活动停用定时
      - name: Keep-alive commit (prevent GitHub disabling scheduled runs)
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
        run: |
          # 同样不依赖 TZ（与门卫一致，用 UTC+8 纯算术）
          date -u -d "+8 hours" '+%Y-%m-%dT%H:%M:%S+0800' > last_build.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 同样不静默吞：失败以 ::warning:: 标黄可见（本步骤 continue-on-error，
          # 且只影响防停用戳，不影响数据更新，故不使其失败）
          git pull --rebase --autostash origin main || echo "::warning::keep-alive 的 pull --rebase 失败（仅影响防 GitHub 停用定时的戳，不影响今日数据更新）"
          git add last_build.txt
          git commit -m "chore: keep-alive [skip ci]" || echo "no changes"
          # 不静默吞失败：推送失败以 ::warning:: 注解显眼标黄（不使整条流水线变红，
          # 避免误触发"每日更新失败"issue；仅提示丢失防停用戳，数据更新已先行完成）
          git push origin main || echo "::warning::keep-alive 戳推送失败（不影响今日数据更新，仅丢失防 GitHub 停用定时的戳，请检查推送权限/并发冲突）"

      # 失败可见告警（仅主触发 16:30 与手动触发，避免兜底重试重复噪音）
      - name: Alert on failure (open/update issue)
        if: failure() && steps.fresh.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v8
        with:
          script: |
            const TITLE = '⚠️ A股全行业OBOS看板每日更新失败';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const ts = new Date().toISOString();
            const body = `每日更新流水线失败（${ts}）。\n运行日志：${runUrl}\n请检查取数源（腾讯/东财/新浪是否可达）/ 质量门禁是否异常。`;
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: ['ci-alert'] });
            const found = existing.data.find(i => i.title === TITLE);
            if (found) {
              await github.rest.issues.createComment({ owner, repo, issue_number: found.number, body: `再次失败 @ ${ts}\n${runUrl}` });
            } else {
              await github.rest.issues.create({ owner, repo, title: TITLE, body, labels: ['ci-alert'] });
